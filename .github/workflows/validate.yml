# The repo has no build and no tests, so this validation is the only net:
# repo invariants first (local script, fast), markdown hygiene next,
# manifests last. npx pulls the latest Claude Code CLI, so a CLI-side
# regression can turn the job red with no change in the repo, which is
# intended, and the weekly trigger catches it between two pushes.
name: validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
      - name: Check the repo invariants
        run: node .github/scripts/validate.mjs
      - name: Check the markdown hygiene
        run: npx -y markdownlint-cli2
      - name: Validate the plugin manifests
        run: npx -y @anthropic-ai/claude-code plugin validate .
